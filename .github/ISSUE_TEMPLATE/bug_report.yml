name: Bug report · 问题反馈
description: 规则没生效、请求被打断、界面报错——按可复现的格式报，修得最快
title: '[bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        中文描述完全没问题（本项目主市场是中文研发语境）。填得越具体，越有可能当天定位。
        Feel free to write in Chinese or English — the maintainers read both.

        ⚠️ Issue 是公开的：请把真实内网域名、token 与抓包内容换成 `fat-api.example.com` / `uat-api.example.com` 这类示例值。安全类问题请按 [SECURITY.md](https://github.com/liaolongdong/cross-origin-proxy/blob/main/SECURITY.md) 私密上报，不要开公开 Issue。

  - type: checkboxes
    id: prechecks
    attributes:
      label: 提交前确认 / Pre-submission checks
      options:
        - label: 已搜索过既有 Issue，没有相同问题
          required: true
        - label: 已在最新版桌面 Chrome 上复现（而不是 Edge / Firefox；本项目只支持 Chrome MV3）
          required: true
        - label: 已确认总开关是开的、规则是启用的，且用 URL 匹配测试器确认过预期命中的规则
          required: true
        - label: 已把敏感域名、token 与抓包内容替换为示例值
          required: true
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened
      description: 一句话结论 + 实际结果 vs 期望结果。有没有「之前好的、升级后坏了」也请说明。
      placeholder: |
        实际：命中规则后页面拿到的是原生响应，请求仍然打到 FAT。
        期望：转发到 UAT，并在日志里看到该规则命中。
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 从哪个页面、点哪里、请求长什么样。能否稳定复现请标出。
      placeholder: |
        1. 打开 https://fat-web.example.com/list
        2. 页面发起 GET https://fat-api.example.com/api/order/list
        3. 规则（见下一栏）开启，总开关开启
        4. 实际：响应仍来自 FAT；日志无该条目
        稳定复现：是
    validations:
      required: true

  - type: textarea
    id: rule
    attributes:
      label: 相关规则配置 / The rule involved
      description: 从规则行的能力徽标（H/B/R/M/D/X/WS）也能说明问题。请去掉真实域名。
      placeholder: |
        匹配类型：wildcard
        匹配模式：https://fat-api.example.com/*
        目标地址：https://uat-api.example.com
        其他能力：请求头覆盖（Authorization）、延迟 2000ms
        优先级：2
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: 转发通道 / Forwarding channel
      description: 日志抽屉或 URL 匹配测试器里能看到规则实际走的是 DNR 还是后台通道。这决定去哪个模块找问题。
      options:
        - DNR（网络层重定向）
        - 后台通道（Service Worker）
        - 不确定 / 两者都试过
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境 / Environment
      description: Chrome 版本、扩展版本（`chrome://extensions` 里可见，或 GitHub Release 标签）、操作系统。
      placeholder: |
        Chrome 141.0.7390.77（arm64）
        扩展版本 1.0.0（从 Releases 的 zip 加载）
        macOS 13.1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与控制台报错 / Logs and errors
      description: 扩展日志抽屉里的条目（方法、状态、耗时、错误）与 `chrome://extensions` 里服务工作线程、页面 DevTools 的报错。文本比截图更容易定位，贴文本即可（记得脱敏）。
      render: shell

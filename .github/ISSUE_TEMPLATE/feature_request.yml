name: Feature request · 功能建议
description: 想要新的能力，或者现有能力在某个场景下不够用
title: '[feat] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        这个扩展刻意只做一件事：在浏览器里把页面的 API 请求改到另一个环境，并按规则改写请求与响应。超出这个边界的需求（比如抓包工具、翻墙代理、自动化脚本）大概率不会做——不是没时间，是做了就会变成另一个产品。中文英文都行。

        This extension stays deliberately narrow: redirect a page's API calls to another environment and modify those requests/responses. Anything beyond that (packet capture, VPN-style proxying, automation) is unlikely to be accepted, and that is a product decision rather than a capacity one.

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / The problem
      description: 具体场景 + 现在怎么做、卡在哪。有截图或脱敏后的请求样例更好。
      placeholder: |
        场景：联调时同一套规则要在 3 个后端环境间来回切，现在只能反复编辑目标域名。
        现状：手动改 8 条规则的 target，改漏一条就排查半小时。
        已试过：批量迁移目标域名（能覆盖但需要先选中规则，且会保留旧环境）。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法 / Expected behaviour
      description: 界面入口、默认值、与现有能力（规则、环境快照、日志）的关系。写清"什么算做好了"。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives considered
      description: 没有理想方案时，退一步能接受的形态是什么？也可以写"导出 JSON 手改"这类现有绕法及其代价。

  - type: dropdown
    id: surface
    attributes:
      label: 涉及的能力面 / Which surface
      options:
        - 规则匹配与重写语义（wildcard / prefix / regex、DNR 与后台通道分流）
        - 请求与响应改写（header / body / mock / delay / block / retry / 方法 / 查询参数）
        - WebSocket
        - 规则管理与批量操作
        - 日志与诊断
        - 导入导出与环境快照
        - 界面（弹窗 / 配置页 / 主题 / 国际化 / 快捷键）
        - 存储与配置结构

  - type: checkboxes
    id: impact
    attributes:
      label: 影响面自检 / Impact disclosure
      description: 项目对存量行为变更的门槛很高（`AGENTS.md` 有明确约定）。请如实勾选，选「会改变」不等于会被拒，只是需要先讨论取舍。
      options:
        - label: 该需求会改变既有的匹配 / 重写语义（含两条通道的一致性）
          required: false
        - label: 该需求会改变 `chrome.storage.local` 里的数据结构或默认值（需要迁移方案）
          required: false
        - label: 该需求需要新增或收窄浏览器权限（会牵动商店审核与用户授权提示）
          required: false
        - label: 该需求需要新增网络请求、远端服务或任何用户数据外传（本项目当前是本地优先，无遥测）
          required: false

  - type: checkboxes
    id: involvement
    attributes:
      label: 参与度 / Involvement
      options:
        - label: 我愿意提交 PR（先在这里对齐方案再动手，避免白做）
          required: false
        - label: 我可以当 beta 验证者（提供真实场景与反馈）
          required: false

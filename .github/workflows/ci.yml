name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, style, format, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version comes from the `packageManager` field in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tsconfig 依赖 `.wxt/` 里的类型声明（`wxt.d.ts` 提供 CSS 模块与
      # `import.meta.env`），而 `.wxt/` 不入库；不先生成则 typecheck 反必红。
      - name: Prepare WXT types
        run: pnpm exec wxt prepare

      - name: ESLint
        run: pnpm lint

      - name: Stylelint
        run: pnpm lint:style

      - name: Prettier check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # build-verification.test.ts asserts against the real bundle, so the
      # production build must exist before the suite runs.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Upload extension package
        if: github.event_name == 'push'
        run: pnpm build:zip

      - name: Attach zip artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3-zip
          path: .output/*.zip
          if-no-files-found: warn

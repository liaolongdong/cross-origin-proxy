name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, style, format, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 校验清单的唯一实现处是 `.github/actions/verify`（release.yml 的发布前
      # 门禁引用同一个动作），新增/调整检查只改那里，避免两份 YAML 漂移。
      - name: Verify
        uses: ./.github/actions/verify

      # Verify 里的 `pnpm build` 已经单次产出 zip，这里只负责挂产物。
      - name: Attach zip artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3-zip
          path: .output/*.zip
          if-no-files-found: error

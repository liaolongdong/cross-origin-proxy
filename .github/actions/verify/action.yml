name: Verify
description: 安装依赖并跑完仓库全套校验（ESLint / Stylelint / Prettier / tsc / vue-tsc / build / vitest）

# CI 与 Release 共用同一份校验实现：任何一项检查的新增或调整只改这里，
# 不需要同步维护两份会漂移的 YAML。
# 调用方必须先 `actions/checkout`，本动作只负责装工具链并跑检查。

inputs:
  build-mode:
    description: 'build = 只产出 .output/chrome-mv3；zip = 同时产出可上传商店的 .output/*-chrome.zip'
    required: false
    default: build
  node-version:
    description: Node.js 版本
    required: false
    default: '22'

runs:
  using: composite
  steps:
    # pnpm 版本取自 package.json 的 packageManager 字段；必须在 setup-node 之前，
    # 否则 pnpm 缓存目录探测不到。
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    # tsconfig 依赖 `.wxt/` 里的类型声明（`wxt.d.ts` 提供 CSS 模块与
    # `import.meta.env`），而 `.wxt/` 不入库；不先生成则 typecheck 必红。
    - name: Prepare WXT types
      run: pnpm exec wxt prepare
      shell: bash

    - name: ESLint
      run: pnpm lint
      shell: bash

    - name: Stylelint
      run: pnpm lint:style
      shell: bash

    - name: Prettier check
      run: pnpm format:check
      shell: bash

    - name: Typecheck
      run: pnpm typecheck
      shell: bash

    # `tsc` 把 `.vue` 当组件类型声明看，`<script setup>` 块与模板表达式全都不进；
    # ESLint 那侧也没开 type-aware 规则。这两处的实参错位、属性名拼错只能原地存在，
    # 所以 Vue 文件另过一遍 vue-tsc。那份 `GlobalComponents` 注册表刻意入库在
    # `types/components.d.ts`（`wxt.config.ts` 的 `Components({ dts })` 指过去，dev/build 生成），
    # 所以这一步排在 Build 之前也读得到它 —— `el-*` 的 prop **取值**与 emit 签名一起进检查。
    # prop **名**拼错仍然查不出：`strictTemplates` 实测一次涌出 45 条，其中 8 条是刻意保留的
    # 透传属性（aria-label / spellcheck / tabindex / @keydown），故维持关闭。
    # 注册表与模板不同步（改了 `<el-*>` 忘了跑 build）由 `tests/elementComponents.test.ts` 点名。
    - name: Typecheck Vue
      run: pnpm typecheck:vue
      shell: bash

    # build-verification.test.ts 断言的是真实构建产物，所以 build 必须在 test 之前。
    # zip 分支：`wxt zip` 内部会先 build，`.output/chrome-mv3` 与 zip 同时就位，
    # 测试照旧可跑，发布任务因此不需要再构建一次。
    - name: Build
      if: ${{ inputs.build-mode != 'zip' }}
      run: pnpm build
      shell: bash

    - name: Build and zip
      if: ${{ inputs.build-mode == 'zip' }}
      run: pnpm build:zip
      shell: bash

    - name: Test
      run: pnpm test
      shell: bash
